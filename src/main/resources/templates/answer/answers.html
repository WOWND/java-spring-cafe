<style>
    .answers-section {
        margin-top: 1.5rem;
    }

    .answers-header {
        font-size: 13px;
        color: var(--text-hint);
        margin-bottom: 0.75rem;
        padding: 0 2px;
    }

    .answers-header strong {
        color: var(--text-secondary);
        font-weight: 500;
    }

    .answer-item {
        padding: 1.25rem 1.5rem;
        border-bottom: 0.5px solid var(--border-color);
    }

    .answer-item:last-child {
        border-bottom: none;
    }

    .answer-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
    }

    .answer-author {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
    }

    .answer-content {
        font-size: 14px;
        color: var(--text-secondary);
        line-height: 1.65;
        word-break: break-word;
    }

    .answers-empty {
        padding: 2.5rem 1rem;
        text-align: center;
        font-size: 14px;
        color: var(--text-hint);
    }

    .answer-form {
        margin-top: 0.75rem;
        padding: 1.25rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .answer-textarea {
        width: 100%;
        resize: none;
        background: var(--bg-input);
        border: 0.5px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 12px 14px;
        font-size: 14px;
        font-family: 'DM Sans', sans-serif;
        color: var(--text-primary);
        line-height: 1.6;
        transition: border-color 0.15s;
        outline: none;
    }

    .answer-textarea::placeholder {
        color: var(--text-hint);
    }

    .answer-textarea:focus {
        border-color: #aaa;
        background: var(--bg-card);
    }

    .answer-form-footer {
        display: flex;
        justify-content: flex-end;
    }

    .answer-submit-btn {
        height: 34px;
        padding: 0 18px;
        background: var(--text-primary);
        color: #ffffff;
        border: none;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 500;
        font-family: 'DM Sans', sans-serif;
        cursor: pointer;
        transition: opacity 0.15s;
    }

    .answer-submit-btn:hover {
        opacity: 0.75;
    }

    .answer-delete-btn {
        height: 24px;
        padding: 0 10px;
        background: transparent;
        color: var(--text-hint);
        border: 0.5px solid var(--border-color);
        border-radius: var(--radius-md);
        font-size: 12px;
        font-family: 'DM Sans', sans-serif;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s;
    }

    .answer-delete-btn:hover {
        color: #e05252;
        border-color: #e05252;
    }
</style>

{{#question}}
<div class="answers-section" data-question-id="{{id}}">
{{/question}}
    <div class="answers-header">댓글 <strong id="answer-count">0</strong></div>

    <div class="card">
        <div id="answer-list">
            <div class="answers-empty">아직 댓글이 없습니다</div>
        </div>
    </div>

    <form id="answer-form" class="card answer-form">
        <textarea class="answer-textarea" id="answer-content" name="content" placeholder="댓글을 입력하세요" rows="3"></textarea>
        <div class="answer-form-footer">
            <button type="submit" class="answer-submit-btn">등록</button>
        </div>
    </form>

{{#question}}
</div>
{{/question}}

<script>
    (function () {
        const questionId = document.querySelector('[data-question-id]').dataset.questionId;
        const answerList = document.getElementById('answer-list');
        const answerCount = document.getElementById('answer-count');

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderAnswers(answers) {
            answerCount.textContent = answers.length;

            if (answers.length === 0) {
                answerList.innerHTML = '<div class="answers-empty">아직 댓글이 없습니다</div>';
                return;
            }

            answerList.innerHTML = answers.map(function (a) {
                const deleteBtn = a.isOwner
                    ? `<button class="answer-delete-btn" data-id="${a.id}">삭제</button>`
                    : '';
                return `
                    <div class="answer-item" data-id="${a.id}">
                        <div class="answer-meta">
                            <span class="answer-author">${escapeHtml(a.author)}</span>
                            ${deleteBtn}
                        </div>
                        <p class="answer-content">${escapeHtml(a.content)}</p>
                    </div>`;
            }).join('');

            answerList.querySelectorAll('.answer-delete-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    deleteAnswer(btn.dataset.id);
                });
            });
        }

        function loadAnswers() {
            fetch('/api/questions/' + questionId + '/answers')
                .then(function (res) { return res.json(); })
                .then(renderAnswers)
                .catch(function (err) { console.error('댓글 로드 실패', err); });
        }

        function deleteAnswer(answerId) {
            fetch('/api/questions/' + questionId + '/answers/' + answerId, {
                method: 'DELETE'
            }).then(function (res) {
                if (res.ok) {
                    loadAnswers();
                }
            }).catch(function (err) { console.error('댓글 삭제 실패', err); });
        }

        document.getElementById('answer-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const textarea = document.getElementById('answer-content');
            const content = textarea.value.trim();
            if (!content) return;

            const formData = new FormData();
            formData.append('content', content);

            fetch('/api/questions/' + questionId + '/answers', {
                method: 'POST',
                body: formData
            }).then(function (res) {
                if (res.ok) {
                    textarea.value = '';
                    loadAnswers();
                }
            }).catch(function (err) { console.error('댓글 등록 실패', err); });
        });

        loadAnswers();
    })();
</script>
